services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: preseason
      POSTGRES_USER: preseason
      POSTGRES_PASSWORD: preseason
    ports:
      - "5432:5432"
    volumes:
      - preseason_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preseason -d preseason"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.compose
    environment:
      DATABASE_URL: postgresql://preseason:preseason@db:5432/preseason
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - preseason_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm run db:migrate &&
      pnpm run db:seed &&
      pnpm run build &&
      pnpm run start"

volumes:
  preseason_postgres_data:
  preseason_node_modules:
